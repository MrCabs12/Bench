<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="BENCH" />
<meta name="theme-color" content="#0a0a0b" />
<title>BENCH Game Log</title>
<style>
  :root{
    --bg:#0a0a0b; --surface:#18181b; --surface2:#27272a; --surface3:#3f3f46;
    --gold:#fbbf24; --goldink:#0a0a0b; --ink:#f4f4f5; --muted:#a1a1aa; --faint:#71717a;
    --red:#ef4444; --green:#34d399; --sky:#38bdf8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;}
  #app{max-width:640px; margin:0 auto; padding:0 12px calc(120px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);}
  button{font-family:inherit; cursor:pointer; border:none;}
  input,select{font-family:inherit; font-size:16px;} /* 16px stops iOS zoom */
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint);}

  header{padding:14px 2px 10px;}
  .brand{font-weight:900; font-size:20px; letter-spacing:-.02em; color:var(--gold);}
  .brand span{color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.18em; margin-left:8px; font-weight:600;}
  .scoreboard{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; background:var(--surface); border-radius:14px; padding:10px 12px; margin-bottom:12px;}
  .centerline{height:2px; background:var(--red); border-radius:2px; margin:0 0 11px; position:relative;}
  .centerline::before{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:50%; background:var(--red);}
  .team{display:flex; align-items:center; gap:9px; min-width:0;}
  .team.away{flex-direction:row-reverse;}
  .team .logo{width:42px; height:42px; border-radius:9px; object-fit:contain; background:var(--surface2); flex:none;}
  .team .ph{width:42px; height:42px; border-radius:9px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--faint); font-size:14px; flex:none; letter-spacing:.02em;}
  .team .info{min-width:0;}
  .team.away .info{text-align:right;}
  .team .name{font-weight:700; font-size:13px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:118px;}
  .team .ha{font-size:9px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); margin-top:2px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:0 2px;}
  .score .nums{font-weight:900; font-size:26px; letter-spacing:.01em; white-space:nowrap;}
  .score .nums .dash{color:var(--faint); margin:0 7px; font-weight:600;}
  .score .per{font-size:9px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; margin-top:1px;}
  .logobtn{padding:9px 12px; border-radius:9px; font-size:13px; font-weight:600; background:var(--surface2); color:var(--muted); flex:none;}
  .clockbtn{padding:8px 12px; border-radius:9px; font-weight:800; font-size:15px; background:var(--surface2); color:var(--gold);}
  .clockbtn.run{background:var(--gold); color:var(--goldink);}
  .miniclear{background:none; color:var(--faint); font-size:12px; padding:4px 6px;}

  .tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; background:var(--surface); padding:4px; border-radius:12px; margin-bottom:16px;}
  .tabs button{padding:9px 0; border-radius:8px; font-weight:600; font-size:14px; background:none; color:var(--muted);}
  .tabs button.on{background:var(--gold); color:var(--goldink);}
  .tabs .tbc{font-size:10px; color:var(--red); margin-left:4px; font-weight:700;}

  .periodbar{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px;}
  .periodbar button{padding:8px 0; border-radius:9px; font-weight:800; font-size:14px; background:var(--surface2); color:var(--muted);}
  .periodbar button.on{background:var(--ink); color:var(--bg);}

  .chips{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .chips.six{grid-template-columns:repeat(3,1fr);}
  .chip{border-radius:10px; display:flex; align-items:center; gap:8px; padding:10px 9px; min-height:52px;
    background:var(--surface2); color:var(--muted); line-height:1.05; text-align:left;}
  .chip.on{background:var(--gold); color:var(--goldink);}
  .chip .n{font-weight:900; font-size:20px; min-width:32px; text-align:center; flex:none;}
  .chip .ctext{display:flex; flex-direction:column; gap:2px; min-width:0; overflow:hidden;}
  .chip .nm{font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.05;}
  .chip .cpos{font-size:9px; color:var(--faint); font-weight:700; line-height:1; letter-spacing:.02em;}
  .chip.on .cpos{color:rgba(10,10,11,.55);}

  .actions{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:18px 0 22px;}
  .actions button{padding:16px 4px; border-radius:12px; font-weight:900; font-size:13px; letter-spacing:.02em;}
  .gf{background:var(--gold); color:var(--goldink);}
  .ga{background:var(--red); color:#fff;}
  .pen{background:var(--surface3); color:var(--ink);}

  .feed{display:flex; flex-direction:column; gap:6px;}
  .ev{display:flex; align-items:center; gap:12px; background:var(--surface); border-left:3px solid var(--surface3);
    border-radius:0 8px 8px 0; padding:9px 8px 9px 12px;}
  .ev.gfk{border-left-color:var(--gold);} .ev.gak{border-left-color:var(--red);}
  .ev .t{color:var(--faint); font-variant-numeric:tabular-nums; font-size:13px; width:70px; flex:none;}
  .ev .per{color:var(--faint); font-size:10px; font-weight:700; width:22px; flex:none;}
  .ev .s{flex:1; font-size:14px;}
  .ev .s b{font-weight:800;}
  .k-gf b{color:var(--gold);} .k-ga b{color:var(--red);}
  .pp{color:var(--sky); font-size:11px; margin-left:4px; font-weight:700;}
  .tbcbadge{font-size:10px; background:var(--red); color:#fff; padding:2px 6px; border-radius:4px; font-weight:800;}
  .editbtn{background:none; color:var(--faint); font-size:12px; padding:4px 8px;}
  .empty{color:var(--faint); text-align:center; padding:36px 12px; font-size:14px; line-height:1.5;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600; padding:8px 4px; text-align:right;}
  th.l,td.l{text-align:left;}
  td{padding:9px 4px; text-align:right; border-top:1px solid var(--surface);}
  td .num{color:var(--gold); font-weight:800; margin-right:8px;}
  td .nm{color:#d4d4d8;}
  .plus{color:var(--green);} .minus{color:var(--red);} .zero{color:var(--faint);}
  .warn{background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.4); border-radius:10px; padding:12px; margin-bottom:16px; font-size:14px; line-height:1.45;}
  .warn b{color:var(--red);}

  .field{margin-bottom:12px;}
  .field .eyebrow{margin-bottom:5px; display:block;}
  .field input, .field select{width:100%; background:var(--surface2); color:var(--ink); border-radius:9px; padding:11px 12px; border:none;}
  .seg{display:flex; gap:4px;}
  .seg button{flex:1; padding:11px 0; border-radius:9px; font-size:15px; background:var(--surface2); color:var(--muted);}
  .seg button.on{background:var(--gold); color:var(--goldink); font-weight:700;}
  .seg.seg3 button{font-size:12.5px; line-height:1.15; padding:10px 2px;}
  .gtbadge{text-align:center; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0 0 12px;}
  .gtbadge.t{color:var(--gold);}
  .ev .wall{display:block; font-size:10px; color:var(--faint); margin-top:1px; font-variant-numeric:tabular-nums;}
  .startinfo{background:var(--surface2); color:var(--muted); border-radius:9px; padding:11px 12px; font-size:14px;}
  .mvpcard{background:var(--surface); border:1px solid var(--surface3); border-radius:12px; padding:14px; margin-top:18px;}
  .mvpcard.set{border-color:var(--gold);}
  .mvptitle{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:800; margin-bottom:8px;}
  .mvpname{font-size:18px; font-weight:800; color:var(--ink); margin-bottom:10px;}
  .mvpsel{width:100%; background:var(--surface2); color:var(--ink); border:none; border-radius:9px; padding:11px 12px; font-size:15px;}
  .mvpstar{color:var(--gold);}
  .xlsxbtn{width:100%; margin-top:18px; padding:15px; border-radius:12px; background:var(--gold); color:var(--goldink); font-weight:900; font-size:15px; letter-spacing:.01em;}
  .copyfallback{margin-top:12px;}
  .copyfallback summary{color:var(--muted); font-size:13px; padding:8px 0; cursor:pointer;}
  .addrow{margin-top:2px;}
  .addrow .addnum{width:46px; flex:none; background:var(--surface2); color:var(--ink); border:none; border-radius:6px; padding:8px 4px; font-size:16px; text-align:center;}
  .addrow .addname{flex:1; min-width:0; background:var(--surface2); color:var(--ink); border:none; border-radius:6px; padding:8px 10px; font-size:16px;}
  .addrow .addposel{flex:none; background:var(--surface2); color:#d4d4d8; border:none; border-radius:6px; padding:8px 4px; font-size:15px;}
  .addplus{width:42px; flex:none; background:var(--gold); color:var(--goldink); border-radius:6px; padding:9px 0; font-weight:900; font-size:20px; line-height:1;}
  .cuptag{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle;}
  .field .teamsel{flex:1; width:auto; min-width:0; background:var(--surface2); color:var(--ink); border:none; border-radius:9px; padding:11px 10px; font-size:15px;}
  .field .teamcustom{width:100%; background:var(--surface2); color:var(--ink); border:none; border-radius:9px; padding:11px 12px; font-size:16px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .rosterrow{display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:8px; padding:7px 8px; margin-bottom:5px;}
  .rosterrow.out{opacity:.45;}
  .rosterrow .num{color:var(--gold); font-weight:800; width:30px;}
  .rosterrow .nm{flex:1; font-size:14px; color:#d4d4d8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rosterrow .pos{font-size:10px; color:var(--faint); width:46px; white-space:nowrap;}
  .rosterrow select{background:var(--surface2); color:#d4d4d8; border-radius:6px; padding:6px 4px; border:none; font-size:13px;}
  .rosterrow .inout{font-size:12px; padding:6px 10px; border-radius:6px; background:none; color:var(--faint);}
  .rosterrow .inout.out{background:var(--surface3); color:#d4d4d8;}
  .danger{width:100%; margin-top:18px; padding:14px; border-radius:11px; background:var(--surface); color:var(--red); font-weight:700; font-size:14px;}

  .ovl{position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .sheet{background:var(--surface); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:92vh; overflow-y:auto;}
  .sheet h3{margin:0; font-size:19px; font-weight:900;}
  .timein{background:var(--surface2); color:var(--gold); font-weight:800; text-align:right; width:84px; border-radius:8px; padding:8px 10px; border:none;}
  .slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .slot{border-radius:10px; padding:9px 4px; text-align:center; background:var(--surface2);}
  .slot.act{outline:2px solid var(--gold);}
  .slot .lab{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint);}
  .slot .val{font-weight:900; color:var(--faint);}
  .slot .val.set{color:var(--gold);}
  .hint{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:10px 0 6px;}
  .hint b{color:var(--gold);}
  .minopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .minopts button{padding:16px 4px; border-radius:11px; font-weight:900; background:var(--surface2); color:var(--muted); font-size:15px;}
  .minopts button.on{background:var(--gold); color:var(--goldink);}
  .minopts button small{display:block; font-size:11px; font-weight:600; opacity:.8; margin-top:2px;}
  .chk{display:flex; align-items:center; gap:9px; margin-top:12px; font-size:14px; color:#d4d4d8;}
  .chk.tbc{color:var(--red);}
  .box{width:20px; height:20px; border-radius:5px; background:var(--surface2); flex:none; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:var(--goldink);}
  .box.on{background:var(--gold);} .box.tbc.on{background:var(--red); color:#fff;}
  .sheetfoot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .sheetfoot .grp{display:flex; gap:8px;}
  .btn{padding:11px 16px; border-radius:10px; font-weight:700; font-size:14px; background:var(--surface2); color:#d4d4d8;}
  .btn.del{color:var(--red);}
  .btn.save{background:var(--gold); color:var(--goldink); font-weight:900; padding:11px 24px;}

  .export{margin-top:20px;}
  .export .row{margin-bottom:5px;}
  .copybtn{font-size:12px; padding:5px 12px; border-radius:6px; background:var(--gold); color:var(--goldink); font-weight:800;}
  .export textarea{width:100%; height:112px; background:var(--surface); color:var(--muted); font-size:11px;
    font-family:ui-monospace,Menlo,monospace; border-radius:9px; padding:8px; resize:none; border:none;}
  .note{font-size:11px; color:var(--faint); margin-top:14px; line-height:1.5;}
  .saved{color:var(--green); font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

var DEFAULT_ROSTER = [
  // Forwards
  {id:"p4",name:"Bruno Caballero",short:"Bruno",num:"4",pos:"F",shoots:"R",line:"",absent:false},
  {id:"p9",name:"Damian Tran",short:"Damian",num:"9",pos:"F",shoots:"R",line:"",absent:false},
  {id:"p14",name:"Lincoln Watson",short:"Lincoln",num:"14",pos:"F",shoots:"R",line:"",absent:false},
  {id:"p19",name:"Connor Simmons",short:"Simmons",num:"19",pos:"F",shoots:"L",line:"",absent:false},
  {id:"p21",name:"Austin McBurnie",short:"McBurnie",num:"21",pos:"F",shoots:"L",line:"",absent:false},
  {id:"p32",name:"Dustin Brown",short:"Dustin",num:"32",pos:"F",shoots:"L",line:"",absent:false},
  {id:"p53",name:"Kieran Artem",short:"Kieran",num:"53",pos:"F",shoots:"R",line:"",absent:false},
  {id:"p77",name:"Austin Proto",short:"Proto",num:"77",pos:"F",shoots:"R",line:"",absent:false},
  {id:"p96",name:"Preston Petkoff",short:"Preston",num:"96",pos:"F",shoots:"L",line:"",absent:false},
  // Defense
  {id:"p0",name:"Clarke Wassilyn",short:"Clarke",num:"00",pos:"D",shoots:"R",line:"",absent:false},
  {id:"p2",name:"Tommy Hood",short:"Tommy",num:"2",pos:"D",shoots:"R",line:"",absent:false},
  {id:"p8",name:"Carter Cremasco",short:"Carter",num:"8",pos:"D",shoots:"L",line:"",absent:false},
  {id:"p13",name:"Elliott Gage",short:"Elliott",num:"13",pos:"D",shoots:"R",line:"",absent:false},
  {id:"p16",name:"Emerson Dean",short:"Emerson",num:"16",pos:"D",shoots:"R",line:"",absent:false},
  {id:"p40",name:"Emerson Solda",short:"Solda",num:"40",pos:"D",shoots:"L",line:"",absent:false},
  // Goalies
  {id:"g31",name:"Donnie Bernardi",short:"Donnie",num:"31",pos:"G",shoots:"L",line:"",absent:false},
  {id:"g48",name:"Matteo Franchetto",short:"Matteo",num:"48",pos:"G",shoots:"L",line:"",absent:false}
];
var STORAGE_KEY = "benchGameLog_v4";

function blankGame(){
  var g0=(DEFAULT_ROSTER.filter(function(p){return p.pos==="G";})[0]||{}).id||"";
  return {
    meta:{date:"", arena:"", homeTeam:"", awayTeam:"", homeCustom:false, awayCustom:false, weAre:"home", gameType:"Regular Season", tournamentName:"", liveBarn:"Yes"},
    roster: DEFAULT_ROSTER.map(function(p){return Object.assign({},p);}),
    onIce:[], events:[], clockBase:0, period:"1", startWall:null, goalie:g0, mvp:""
  };
}

// transient (not persisted)
var ui = {tab:"log", modal:null, onlyTbc:false, running:false, anchor:null, savedFlash:false, confirmClear:false, addForm:{num:"",name:"",pos:"F"}};
var game = blankGame();
var clockTimer = null;

// ---------- helpers ----------
function fmt(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function parseTime(t){ var m=String(t).match(/^(\d+):(\d{1,2})$/); return m? parseInt(m[1],10)*60+parseInt(m[2],10) : null; }
function elapsed(){ return game.clockBase + (ui.running && ui.anchor ? (Date.now()-ui.anchor)/1000 : 0); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function fmtWall(ts){ if(!ts) return ""; var dt=new Date(ts); var h=dt.getHours(), mm=dt.getMinutes(); var ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(mm).padStart(2,"0")+" "+ap; }
function goalies(){ return game.roster.filter(function(p){return p.pos==="G" && !p.absent;}); }
// team logos persist separately so they survive "New game" across the season

function loadTeams(){ try{ var r=localStorage.getItem(TEAMS_KEY); if(r) teams=JSON.parse(r); }catch(e){} }
function saveTeams(){ try{ localStorage.setItem(TEAMS_KEY, JSON.stringify(teams)); }catch(e){} }
function teamKey(n){ return String(n||"").trim().toLowerCase(); }
// Division teams (match the standings spelling; logos are baked in for these)
var KNOWN_TEAMS = ["Brampton 45s","Burlington Eagles","Centre Wellington Fusion","Flamborough Sabres","Garden City Minor Falcons","Glancaster Bombers","Guelph Gryphons","Halton Hills Thunder","Hamilton Steel","Milton Winterhawks","Niagara Falls Canucks","Norfolk Knights","Oakville Rangers","Stoney Creek Warriors","West Niagara Flying Aces"];
function isKnown(name){ var k=teamKey(name); return KNOWN_TEAMS.some(function(t){return teamKey(t)===k;}); }
function canonicalKnown(name){ var k=teamKey(name); for(var i=0;i<KNOWN_TEAMS.length;i++){ if(teamKey(KNOWN_TEAMS[i])===k) return KNOWN_TEAMS[i]; } return name; }
function getLogo(n){ var k=teamKey(n); if(k&&teams[k]) return teams[k]; if(k&&BAKED_LOGOS[k]) return BAKED_LOGOS[k]; return null; }
function downscale(dataURL, cb){
  var img=new Image();
  img.onload=function(){
    var max=200, w=img.width, h=img.height, s=Math.min(1, max/Math.max(w,h));
    var cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
    try{ var c=document.createElement("canvas"); c.width=cw; c.height=ch;
      c.getContext("2d").drawImage(img,0,0,cw,ch); cb(c.toDataURL("image/png")); }
    catch(e){ cb(dataURL); }
  };
  img.onerror=function(){ cb(dataURL); };
  img.src=dataURL;
}

// ---------- stats ----------
function computeStats(){
  return skaters().map(function(p){
    var g=0,a=0,gfOn=0,gaOn=0,pmF=0,pmA=0,pim=0,penC=0;
    game.events.forEach(function(e){
      if(e.type==="GF"){
        if(e.scorer===p.id) g++;
        if((e.assists||[]).indexOf(p.id)>=0) a++;
        if((e.onIce||[]).indexOf(p.id)>=0){ gfOn++; if(e.even) pmF++; }
      } else if(e.type==="GA"){
        if((e.onIce||[]).indexOf(p.id)>=0){ gaOn++; if(e.even) pmA++; }
      } else if(e.type==="PEN"){
        if(e.player===p.id){ pim+=Number(e.mins||0); penC++; }
      }
    });
    return {p:p,g:g,a:a,pts:g+a,gfOn:gfOn,gaOn:gaOn,pm:pmF-pmA,pim:pim,penC:penC};
  });
}
function opponent(){ return game.meta.weAre==="home" ? game.meta.awayTeam : game.meta.homeTeam; }

// ---- dependency-free XLSX writer + one-file export ----
var _crc=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=_crc[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function _cat(arrs){var l=0;arrs.forEach(function(a){l+=a.length;});var o=new Uint8Array(l),p=0;arrs.forEach(function(a){o.set(a,p);p+=a.length;});return o;}
function _u16(n){return new Uint8Array([n&0xFF,(n>>>8)&0xFF]);}
function _u32(n){return new Uint8Array([n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF]);}
function zipStore(files){
  var enc=new TextEncoder(),chunks=[],central=[],offset=0;
  files.forEach(function(f){
    var nb=enc.encode(f.name),crc=crc32(f.bytes),sz=f.bytes.length;
    var lfh=_cat([_u32(0x04034b50),_u16(20),_u16(0),_u16(0),_u16(0),_u16(0),_u32(crc),_u32(sz),_u32(sz),_u16(nb.length),_u16(0),nb]);
    chunks.push(lfh,f.bytes);
    central.push(_cat([_u32(0x02014b50),_u16(20),_u16(20),_u16(0),_u16(0),_u16(0),_u16(0),_u32(crc),_u32(sz),_u32(sz),_u16(nb.length),_u16(0),_u16(0),_u16(0),_u16(0),_u32(0),_u32(offset),nb]));
    offset+=lfh.length+sz;
  });
  var cd=_cat(central);
  var eocd=_cat([_u32(0x06054b50),_u16(0),_u16(0),_u16(files.length),_u16(files.length),_u32(cd.length),_u32(offset),_u16(0)]);
  return _cat(chunks.concat([cd,eocd]));
}
function _xesc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function _colName(n){var s="";n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function buildXlsx(sheets){
  var enc=new TextEncoder();
  function sheetXml(sh){
    var rx="";
    sh.rows.forEach(function(row,ri){
      var cells="";
      row.forEach(function(v,ci){
        if(v===null||v===undefined||v==="")return;
        var ref=_colName(ci)+(ri+1);
        if(typeof v==="number"&&isFinite(v)) cells+='<c r="'+ref+'"><v>'+v+'</v></c>';
        else cells+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+_xesc(v)+'</t></is></c>';
      });
      rx+='<row r="'+(ri+1)+'">'+cells+'</row>';
    });
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rx+'</sheetData></worksheet>';
  }
  var files=[];
  files.push({name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map(function(s,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join("")+"</Types>"});
  files.push({name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});
  files.push({name:"xl/workbook.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+_xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';}).join("")+"</sheets></workbook>"});
  files.push({name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map(function(s,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';}).join("")+"</Relationships>"});
  sheets.forEach(function(s,i){files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:sheetXml(s)});});
  return zipStore(files.map(function(f){return {name:f.name,bytes:enc.encode(f.data)};}));
}
function safeName(){
  var base="BENCH "+(opponent()||"game")+" "+(game.meta.date||"");
  return base.replace(/[^\w\- ]/g,"").trim().replace(/\s+/g,"_").replace(/^_+|_+$/g,"")+".xlsx";
}
function exportXlsx(){
  try{
    var sheets=[
      {name:"List of Games", rows:listOfGamesArr()},
      {name:"Game Log", rows:gameLogArr()},
      {name:"Event Log", rows:eventLogArr()}
    ];
    var bytes=buildXlsx(sheets);
    var fname=safeName();
    var blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var file=null;
    try{ file=new File([blob],fname,{type:blob.type}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:fname}).catch(function(){ downloadBlob(blob,fname); });
    } else {
      downloadBlob(blob,fname);
    }
  }catch(e){ alert("Couldn't build the Excel file on this device — use \u201cCopy as text instead\u201d below."); }
}
function downloadBlob(blob,fname){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=fname; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); },1500);
  }catch(e){ alert("Download not supported here — use \u201cCopy as text instead\u201d below."); }
}

// ---------- open / save modal ----------
function openGF(){ ui.modal={kind:"GF",editingId:null,draft:{scorer:null,assists:[],onIce:game.onIce.slice(),even:true,tbc:false,time:fmt(elapsed()),target:"scorer"}}; render(); }
function openGA(){ ui.modal={kind:"GA",editingId:null,draft:{onIce:game.onIce.slice(),goalie:game.goalie,even:true,tbc:false,time:fmt(elapsed())}}; render(); }
function openPEN(){ ui.modal={kind:"PEN",editingId:null,draft:{player:null,mins:2,tbc:false,time:fmt(elapsed())}}; render(); }
function editEvent(id){
  var e=null; for(var i=0;i<game.events.length;i++) if(game.events[i].id===id) e=game.events[i];
  if(!e) return;
  var d=Object.assign({},e); d.assists=(e.assists||[]).slice(); d.onIce=(e.onIce||[]).slice(); if(e.type==="GF") d.target=firstEmptySlot(d);
  ui.modal={kind:e.type,editingId:id,draft:d}; render();
}
function saveModal(){
  var m=ui.modal, d=m.draft, t=parseTime(d.time);
  var base={time:d.time,timeSec:(t==null?null:t),tbc:!!d.tbc,period:(d.period||game.period)};
  if(!m.editingId) base.wall=Date.now();
  var ev;
  if(m.kind==="GF"){ var as=[d.assists&&d.assists[0], d.assists&&d.assists[1]].filter(function(a){return a && a!==d.scorer;}); as=as.filter(function(a,i,arr){return arr.indexOf(a)===i;}); ev=Object.assign({type:"GF",scorer:d.scorer,assists:as,onIce:d.onIce||[],even:!!d.even},base); }
  else if(m.kind==="GA"){ ev=Object.assign({type:"GA",onIce:d.onIce||[],even:!!d.even,goalie:d.goalie||""},base); game.goalie=d.goalie||game.goalie; }
  else ev=Object.assign({type:"PEN",player:d.player,mins:d.mins},base);
  mutate(function(){
    if(m.editingId){ game.events=game.events.map(function(e){ return e.id===m.editingId?Object.assign({},e,ev):e; }); }
    else { ev.id="e"+Date.now()+Math.random().toString(36).slice(2,6); game.events.push(ev); }
    game.events.sort(function(a,b){ return (a.timeSec==null?1e9:a.timeSec)-(b.timeSec==null?1e9:b.timeSec); });
  });
  ui.modal=null; render();
}

  h+=st.map(function(s){
    var pmc=s.pm>0?"plus":s.pm<0?"minus":"zero";
    return '<tr><td class="l"><span class="num">'+esc(s.p.num)+'</span><span class="nm">'+(s.p.id===game.mvp?'<span class="mvpstar">★</span> ':'')+esc(s.p.name)+'</span></td>'+
      '<td>'+s.g+'</td><td>'+s.a+'</td><td style="font-weight:700">'+s.pts+'</td>'+
      '<td style="color:var(--muted)">'+s.gfOn+'</td><td style="color:var(--muted)">'+s.gaOn+'</td>'+
      '<td class="'+pmc+'">'+(s.pm>0?"+":"")+s.pm+'</td><td style="color:var(--muted)">'+s.pim+'</td></tr>';
  }).join("");
  h+='</tbody></table>';
  var gs=goalies();
  if(gs.length){
    h+='<div class="eyebrow" style="padding:16px 0 6px">Goalies</div>';
    h+='<table><thead><tr><th class="l">Goalie</th><th>GA</th></tr></thead><tbody>';
    h+=gs.map(function(g){
      var ga=game.events.filter(function(e){return e.type==="GA" && e.goalie===g.id;}).length;
      return '<tr><td class="l"><span class="num">'+esc(g.num)+'</span><span class="nm">'+(g.id===game.mvp?'<span class="mvpstar">★</span> ':'')+esc(g.name)+'</span></td><td>'+ga+'</td></tr>';
    }).join("");
    h+='</tbody></table>';
  }
  h+=mvpCard();
  h+='<button class="xlsxbtn" data-act="xlsx">⬇  Export game to Excel (.xlsx)</button>';
  h+='<div class="note">One file, three tabs — List of Games, Game Log, Event Log. On iPhone this opens the share sheet, so you can AirDrop it to your Mac or Save to Files. Numbers stay numbers; leading zeros (00) are kept.</div>';
  h+='<details class="copyfallback"><summary>Or copy as text instead</summary>'+
     exportBlock("① List of Games row","listgames",listOfGamesRow())+
     exportBlock("② Game Log rows","gamelog",gameLogTSV())+
     exportBlock("Event log with timestamps","events",eventsCSV())+
     '</details>';
  h+='<div class="note">Game Log matches your sheet\'s column order; List of Games carries arena, score, goalie and MVP. Penalty # is a count — your sheet does ×2 for minutes, so 5-minute majors will undercount unless you adjust that.</div>';
  return h;
}
function mvpCard(){
  var mv=game.mvp, p=mv?byId(mv):null;
  var players=game.roster.filter(function(x){return !x.absent;});
  var opts='<option value="">— Select game MVP —</option>';
  players.forEach(function(x){ opts+='<option value="'+x.id+'"'+(mv===x.id?" selected":"")+'>#'+esc(x.num)+' '+esc(x.name)+' ('+esc(x.pos)+')</option>'; });
  return '<div class="mvpcard'+(p?" set":"")+'">'+
    '<div class="mvptitle">★ Game MVP (belt)</div>'+
    (p?'<div class="mvpname">#'+esc(p.num)+' '+esc(p.name)+'</div>':'')+
    '<select class="mvpsel" data-field="mvpPick">'+opts+'</select>'+
  '</div>';
}
function exportBlock(label,key,text){
  return '<div class="export"><div class="row between"><span class="eyebrow">'+label+'</span>'+
    '<button class="copybtn" data-act="copy" data-id="'+key+'">Copy</button></div>'+
    '<textarea readonly id="ta-'+key+'">'+esc(text)+'</textarea></div>';
}
function setupView(){
  var m=game.meta;
  var h='<div class="grid2">'+field("Date / time","date",m.date,"1-17-26 2:30 PM")+field("Arena","arena",m.arena||"","Rink / venue")+'</div>';
  h+='<div class="field"><span class="eyebrow">Game start (real time)</span><div class="startinfo">'+(game.startWall?esc(fmtWall(game.startWall)):"— recorded when you tap ▶ to start the clock")+'</div></div>';
  h+='<div class="field"><span class="eyebrow">Game type</span><div class="seg seg3">'+
      seg("gameType","Exhibition","Exhibition",m.gameType)+
      seg("gameType","Regular Season","Regular Season",m.gameType)+
      seg("gameType","Tournament","Tournament",m.gameType)+
    '</div></div>';
  if(m.gameType==="Tournament"){
    h+='<div class="field"><span class="eyebrow">Tournament name</span>'+
       '<input data-field="tournamentName" value="'+esc(m.tournamentName||"")+'" placeholder="e.g. Silver Stick, Early Bird Classic"></div>';
  }
  h+=teamField("Home team","home");
  h+=teamField("Away team","away");
  h+='<div class="grid2">'+
    '<div class="field"><span class="eyebrow">We are</span><div class="seg">'+
      seg("weAre","home","Home",m.weAre)+seg("weAre","away","Away",m.weAre)+'</div></div>'+
    '<div class="field"><span class="eyebrow">LiveBarn</span><div class="seg">'+
      seg("liveBarn","Yes","Yes",m.liveBarn)+seg("liveBarn","No","No",m.liveBarn)+'</div></div>'+
  '</div>';
  h+='<div class="eyebrow" style="padding:6px 0 8px">Roster — set lines, mark absences</div>';
  h+=game.roster.map(function(p){
    return '<div class="rosterrow'+(p.absent?" out":"")+'"><span class="num">'+esc(p.num)+'</span>'+
      '<span class="nm">'+esc(p.name)+(p.custom?' <span class="cuptag">call-up</span>':'')+'</span><span class="pos">'+esc(p.pos)+(p.shoots?" · "+esc(p.shoots):"")+'</span>'+
      (p.pos!=="G"?'<select data-field="line" data-id="'+p.id+'">'+
        ["","A","B","C"].map(function(o){return '<option'+(p.line===o?" selected":"")+'>'+(o||"—")+'</option>';}).join("")+'</select>':'')+
      (p.custom
        ? '<button class="inout out" data-act="removePlayer" data-id="'+p.id+'">remove</button>'
        : '<button class="inout'+(p.absent?" out":"")+'" data-act="absent" data-id="'+p.id+'">'+(p.absent?"absent":"in")+'</button>')+
      '</div>';
  }).join("");
  var af=ui.addForm||{num:"",name:"",pos:"F"};
  h+='<div class="eyebrow" style="padding:10px 0 8px">Add a player (call-up / affiliate)</div>';
  h+='<div class="rosterrow addrow">'+
       '<input class="addnum" data-field="addNum" value="'+esc(af.num)+'" placeholder="#" inputmode="numeric">'+
       '<input class="addname" data-field="addName" value="'+esc(af.name)+'" placeholder="Full name">'+
       '<select class="addposel" data-field="addPos">'+
         ["F","D","G"].map(function(o){return '<option value="'+o+'"'+(af.pos===o?" selected":"")+'>'+o+'</option>';}).join("")+
       '</select>'+
       '<button class="addplus" data-act="addPlayer">+</button>'+
     '</div>';
  h+='<button class="danger" data-act="newgame">New game (clear everything)</button>';
  return h;
}
function field(label,key,val,ph){ return '<div class="field"><span class="eyebrow">'+label+'</span><input data-field="'+key+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'"></div>'; }
function teamField(label,side){
  var m=game.meta, name=m[side+"Team"]||"";
  var custom = m[side+"Custom"] || (name && !isKnown(name));
  var logo=getLogo(name);
  var thumb = logo ? '<img src="'+logo+'" style="width:38px;height:38px;border-radius:8px;object-fit:contain;background:var(--surface2);flex:none">'
                    : '<div class="ph" style="width:38px;height:38px;font-size:13px">'+esc(initials(name))+'</div>';
  var selVal = custom ? "__other__" : (isKnown(name)?canonicalKnown(name):"");
  var opts='<option value="">Select team…</option>';
  KNOWN_TEAMS.forEach(function(t){ opts+='<option value="'+esc(t)+'"'+(selVal===t?" selected":"")+'>'+esc(t)+'</option>'; });
  opts+='<option value="__other__"'+(custom?" selected":"")+'>Other (enter name)…</option>';
  var h='<div class="field"><span class="eyebrow">'+label+'</span>'+
    '<div class="row" style="gap:8px">'+thumb+
    '<select class="teamsel" data-field="'+side+'TeamPick">'+opts+'</select>'+
    '<button class="logobtn" data-act="setLogo" data-id="'+side+'">'+(logo?"Change":"Logo")+'</button>'+
    '</div>';
  if(custom){
    h+='<input class="teamcustom" data-field="'+side+'Team" value="'+esc(name)+'" placeholder="Enter team name" style="margin-top:8px">';
  }
  return h+'</div>';
}
function seg(field,val,label,cur){ return '<button class="'+(cur===val?"on":"")+'" data-act="meta" data-field="'+field+'" data-id="'+val+'">'+label+'</button>'; }

function modalView(){
  if(!ui.modal) return "";
  var m=ui.modal, d=m.draft, sk=skaters();
  var title=m.kind==="GF"?"Goal for":m.kind==="GA"?"Goal against":"Penalty";
  var body="";
  if(m.kind==="GF"){
    var slot=function(t,name,val){ var set=val&&val!=="—"; return '<button class="slot'+(d.target===t?" act":"")+'" data-act="mtarget" data-id="'+t+'"><div class="lab">'+name+'</div><div class="val'+(set?" set":"")+'">'+(set?val:"tap")+'</div></button>'; };
    body+='<div class="slots">'+slot("scorer","Scorer",d.scorer?"#"+numOf(d.scorer):"")+
      slot("a1","Assist 1",d.assists[0]?"#"+numOf(d.assists[0]):"")+
      slot("a2","Assist 2",d.assists[1]?"#"+numOf(d.assists[1]):"")+'</div>';
    body+='<div class="hint">Tap a slot, then a number — filling <b>'+(d.target==="a1"?"Assist 1":d.target==="a2"?"Assist 2":"Scorer")+'</b></div>';
    body+='<div class="chips six">'+sk.map(function(p){
      var isS=d.scorer===p.id, ai=d.assists.indexOf(p.id), hl=isS||ai>=0;
      return chip(p,hl,"mpick");
    }).join("")+'</div>';
    body+='<div class="hint">On ice for this goal · '+d.onIce.length+'</div>';
    body+='<div class="chips six">'+onIcePicker(d.onIce,sk)+'</div>';
  } else if(m.kind==="GA"){
    body+='<div class="hint">Goalie in net</div>';
    body+='<div class="chips six">'+goalies().map(function(g){return chip(g,d.goalie===g.id,"mgoalie");}).join("")+'</div>';
    body+='<div class="hint">On ice against · '+d.onIce.length+'</div>';
    body+='<div class="chips six">'+onIcePicker(d.onIce,sk)+'</div>';
  } else {
    body+='<div class="chips six">'+sk.map(function(p){return chip(p,d.player===p.id,"mpen");}).join("")+'</div>';
    body+='<div class="hint">Penalty</div>';
    body+='<div class="minopts">'+
      '<button class="'+(d.mins===2?"on":"")+'" data-act="mmins" data-id="2">MINOR<small>2 min</small></button>'+
      '<button class="'+(d.mins===5?"on":"")+'" data-act="mmins" data-id="5">MAJOR<small>5 min</small></button></div>';
  }
  var evenChk = (m.kind==="GF"||m.kind==="GA") ?
    '<div class="chk" data-act="meven"><span class="box'+(d.even?" on":"")+'">'+(d.even?"✓":"")+'</span> Even strength (counts toward +/-) — untick for a power-play goal</div>' : '';
  return '<div class="ovl" data-act="ovl"><div class="sheet" data-stop="1">'+
    '<div class="row between"><h3>'+title+'</h3><input class="timein" data-field="mtime" value="'+esc(d.time)+'" placeholder="m:ss"></div>'+
    body+evenChk+
    '<div class="chk tbc" data-act="mtbc"><span class="box tbc'+(d.tbc?" on":"")+'">'+(d.tbc?"✓":"")+'</span> Not sure — flag TBC</div>'+
    '<div class="sheetfoot"><div></div><div class="grp">'+
      (m.editingId?'<button class="btn del" data-act="mdelete">Delete</button>':'')+
      '<button class="btn" data-act="ovl">Cancel</button>'+
      '<button class="btn save" data-act="msave">Save</button></div></div>'+
    '</div></div>';
}
function onIcePicker(list,sk){
  var set={}; list.forEach(function(id){set[id]=1;});
  return sk.map(function(p){return chip(p,!!set[p.id],"monice");}).join("");
}

// ---------- main render ----------
function render(){
  var h=header()+tabs();
  if(ui.tab==="log") h+=logView();
  else if(ui.tab==="stats") h+=statsView();
  else h+=setupView();
  h+=modalView();
  h+=confirmView();
  document.getElementById("app").innerHTML=h;
  if(ui.running && !clockTimer) startTick();
}
function confirmView(){
  if(!ui.confirmClear) return "";
  return '<div class="ovl" data-act="clearCancel"><div class="sheet" data-stop="1" style="max-width:420px">'+
    '<h3>Clear this game?</h3>'+
    '<p style="color:var(--muted); font-size:14px; line-height:1.5; margin:10px 0 0">This wipes the current game — events, on-ice, teams, clock, and start time. Export to your sheet first if you need it. Team logos are kept.</p>'+
    '<div class="sheetfoot"><div></div><div class="grp">'+
      '<button class="btn" data-act="clearCancel">Cancel</button>'+
      '<button class="btn save" style="background:var(--red); color:#fff" data-act="clearConfirm">Clear everything</button>'+
    '</div></div></div></div>';
}

// ---------- events (delegation) ----------
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  switch(act){
    case "tab": ui.tab=id; ui.modal=null; render(); break;
    case "clock": toggleClock(); break;
    case "clockReset": resetClock(); break;
    case "period": mutate(function(){ game.period=id; }); break;
    case "oniceToggle": mutate(function(){ var i=game.onIce.indexOf(id); if(i>=0) game.onIce.splice(i,1); else game.onIce.push(id); }); break;
    case "oniceClear": mutate(function(){ game.onIce=[]; }); break;
    case "openGF": openGF(); break;
    case "openGA": openGA(); break;
    case "openPEN": openPEN(); break;
    case "edit": editEvent(id); break;
    case "filterTbc": ui.onlyTbc=!ui.onlyTbc; render(); break;
    case "meta": mutate(function(){ game.meta[el.getAttribute("data-field")]=id; }); break;
    case "absent": mutate(function(){ var p=byId(id); if(p){ p.absent=!p.absent; if(p.absent){ var k=game.onIce.indexOf(id); if(k>=0) game.onIce.splice(k,1);} } }); break;
    case "addPlayer": addPlayer(); break;
    case "removePlayer": mutate(function(){
        game.roster=game.roster.filter(function(p){return p.id!==id;});
        game.onIce=game.onIce.filter(function(x){return x!==id;});
        if(game.goalie===id) game.goalie=(goalies()[0]||{}).id||"";
        if(game.mvp===id) game.mvp="";
      }); break;
    case "newgame": ui.confirmClear=true; render(); break;
    case "clearCancel": ui.confirmClear=false; render(); break;
    case "clearConfirm": game=blankGame(); ui.running=false; ui.anchor=null; ui.confirmClear=false; stopTick(); save(); render(); break;
    case "copy": doCopy(id); break;
    case "xlsx": exportXlsx(); break;
    case "setLogo": pickLogo(id); break;
    // modal
    case "ovl": ui.modal=null; render(); break;
    case "mgoalie": ui.modal.draft.goalie=id; render(); break;
    case "mtarget": ui.modal.draft.target=id; render(); break;
    case "mpick": modalPick(id); break;
    case "monice": modalOnice(id); break;
    case "mpen": ui.modal.draft.player=id; render(); break;
    case "mmins": ui.modal.draft.mins=parseInt(id,10); render(); break;
    case "meven": ui.modal.draft.even=!ui.modal.draft.even; render(); break;
    case "mtbc": ui.modal.draft.tbc=!ui.modal.draft.tbc; render(); break;
    case "mdelete": deleteEvent(ui.modal.editingId); ui.modal=null; render(); break;
    case "msave": saveModal(); break;
  }
});
// stop clicks inside sheet from closing overlay
document.addEventListener("click",function(ev){
  if(ev.target.closest('[data-stop]') && !ev.target.closest("[data-act]")) ev.stopPropagation();
},true);

function firstEmptySlot(d){
  if(!d.scorer) return "scorer";
  if(!d.assists || !d.assists[0]) return "a1";
  if(!d.assists[1]) return "a2";
  return "a1";
}
function modalPick(id){
  var d=ui.modal.draft;
  d.assists = d.assists || [];
  var t = d.target || "scorer";
  if(t==="scorer"){
    if(d.scorer===id){ d.scorer=null; }          // tap the scorer again to clear
    else { d.scorer=id; if(!d.assists[0]) d.target="a1"; }
    if(d.assists[0]===id) d.assists[0]=null;      // a player can hold only one role
    if(d.assists[1]===id) d.assists[1]=null;
  } else if(t==="a1"){
    if(id===d.scorer){ /* already the scorer — ignore */ }
    else if(d.assists[0]===id){ d.assists[0]=null; }
    else { d.assists[0]=id; if(!d.assists[1]) d.target="a2"; }
  } else { // a2
    if(id===d.scorer){ }
    else if(d.assists[1]===id){ d.assists[1]=null; }
    else { d.assists[1]=id; }
  }
  if(d.onIce.indexOf(id)<0) d.onIce.push(id);
  render();
}
function modalOnice(id){ var a=ui.modal.draft.onIce, i=a.indexOf(id); if(i>=0) a.splice(i,1); else a.push(id); render(); }
function addPlayer(){
  var af=ui.addForm||{};
  var num=String(af.num||"").trim(), name=String(af.name||"").trim(), pos=af.pos||"F";
  if(!name){ alert("Enter the player's name."); return; }
  if(!num){ alert("Enter the player's number."); return; }
  var id="cust"+Date.now()+Math.random().toString(36).slice(2,5);
  var p={ id:id, name:name, short:name.split(/\s+/)[0], num:num, pos:pos, shoots:"", line:"", absent:false, custom:true };
  mutate(function(){ game.roster.push(p); });
  ui.addForm={num:"",name:"",pos:"F"};
  render();
}

// text inputs (no re-render, keep focus)
document.addEventListener("change",function(ev){
  var el=ev.target.closest("[data-field]"); if(!el) return;
  var f=el.getAttribute("data-field");
  if(f==="mvpPick"){ game.mvp=el.value; save(); render(); return; }
  if(f==="homeTeamPick"||f==="awayTeamPick"){
    var side=f.slice(0,4);           // "home" or "away"
    var v=el.value;
    if(v==="__other__"){
      if(isKnown(game.meta[side+"Team"])) game.meta[side+"Team"]="";
      game.meta[side+"Custom"]=true;
    } else {
      game.meta[side+"Custom"]=false;
      game.meta[side+"Team"]=v;
    }
    save(); render();
  }
});

document.addEventListener("input",function(ev){
  var el=ev.target.closest("[data-field]"); if(!el) return;
  var f=el.getAttribute("data-field");
  if(f==="mtime"){ if(ui.modal) ui.modal.draft.time=el.value; return; }
  if(f==="line"){ var p=byId(el.getAttribute("data-id")); if(p){ p.line=(el.value==="—"?"":el.value); save(); } return; }
  if(f==="addNum"){ ui.addForm.num=el.value; return; }
  if(f==="addName"){ ui.addForm.name=el.value; return; }
  if(f==="addPos"){ ui.addForm.pos=el.value; return; }
  if(game.meta.hasOwnProperty(f)){ game.meta[f]=el.value; save(); flashSaved(); }
});

function flashSaved(){ /* subtle; avoid re-render churn while typing */ }

function doCopy(key){
  var ta=document.getElementById("ta-"+key); if(!ta) return;
  ta.focus(); ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(function(){}); ok=true; }
  var btn=document.querySelector('[data-act="copy"][data-id="'+key+'"]');
  if(btn){ var old=btn.textContent; btn.textContent=ok?"copied ✓":"select + copy"; setTimeout(function(){ btn.textContent=old; },1500); }
}

// ---------- boot ----------
load();
loadTeams();
render();
</script>
</body>
